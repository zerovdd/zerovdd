[workspace]
members = [
    "zerovdd-iddcx-sys",
    "zerovdd-driver",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.metadata.wdk.driver-model]
driver-type = "UMDF"
umdf-version-major = 2
target-umdf-version-minor = 33
minimum-umdf-version-minor = 33

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
