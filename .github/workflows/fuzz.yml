name: Nightly Fuzz Smoke

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-smoke:
    name: Nightly cargo-fuzz smoke run
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly

      - name: Configure Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: "fuzz-nightly"

      - name: Run fuzz targets (when fuzz/ is present)
        shell: bash
        run: |
          if [ ! -f "fuzz/Cargo.toml" ]; then
            echo "Skipping fuzz smoke run: fuzz/Cargo.toml not yet present."
            exit 0
          fi
          cargo install --locked cargo-fuzz
          for target in proto_decode edid_parse modes_plan config_parse; do
            if [ -f "fuzz/fuzz_targets/${target}.rs" ]; then
              cargo +nightly fuzz run "${target}" -- -max_total_time=15
            fi
          done
