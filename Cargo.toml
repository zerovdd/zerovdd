[workspace]
members = ["crates/*"]
exclude = ["driver-wdk", "fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
thiserror = { version = "2", default-features = false }
anyhow = "1"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", default-features = false, features = ["v5"] }
clap = { version = "4", features = ["derive"] }
proptest = "1"
windows = "0.62"
windows-service = "0.8"
syn = { version = "3", features = ["full", "visit"] }
regex = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
spin = { version = "0.12", default-features = false, features = ["mutex", "spin_mutex", "rwlock"] }
sha2 = "0.11"

[profile.test]
debug = 0

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
